<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>张三的名片</title>
</head>
<body>
  <!-- 验收点 1：姓名 —— 你原来的 <h1>张三</h1>，原样保留 -->
  <h1>张三</h1>

  <!-- 验收点 2：一句话简介 —— 本次唯一必须新增的一行 -->
  <p>我在学前端，从列表开始。</p>

  <!-- 验收点 3：知识点 ul/ol/li —— 用 ul，因为联系方式无先后顺序 -->
  <ul>
    <li>邮箱：zhangsan@example.com</li>
    <li>GitHub：github.com/zhangsan</li>
    <li>常驻：上海</li>
  </ul>
</body>
</html>
