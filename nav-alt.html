<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>张三 · 单页导航与锚点（只用 style 属性的对照版）</title>
</head>
<body>

  <!-- 对照版：整页不写一个 <style> 块，所有样式全走 style 属性。
       用来验证"实现要点 4 只要求用 style 属性，不要求你会写选择器"。
       代价：display:inline-block 要在 4 个 li 上各抄一遍，改样式要改 4 处。 -->
  <div class="nav" style="background-color: #ffe9b3; padding: 10px 14px;">
    <ul style="list-style: none; margin: 0; padding: 0;">
      <li style="display: inline-block; margin-right: 20px;"><a href="#about">关于我</a></li>
      <li style="display: inline-block; margin-right: 20px;"><a href="#skills">我会什么</a></li>
      <li style="display: inline-block; margin-right: 20px;"><a href="#plan">接下来学什么</a></li>
      <li style="display: inline-block; margin-right: 20px;"><a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML" target="_blank" rel="noopener">MDN 文档（外部）</a></li>
    </ul>
  </div>

  <div class="section" id="about" style="min-height: 70vh; padding: 16px 4px; border-bottom: 1px dashed #cfcfcf;">
    <h2>关于我</h2>
    <p>我是张三，正在从零学 HTML。</p>
    <p>这一版把样式全部写在 style 属性里，方便和 nav.html 对照。</p>
  </div>

  <div class="section" id="skills" style="min-height: 70vh; padding: 16px 4px; border-bottom: 1px dashed #cfcfcf;">
    <h2>我会什么</h2>
    <p>标题、段落、加粗、斜体、表格、图片、列表都练过。</p>
    <p>今天新增的是：让 a 标签的 href 指向页面内部的 id。</p>
  </div>

  <div class="section" id="plan" style="min-height: 70vh; padding: 16px 4px; border-bottom: 1px dashed #cfcfcf;">
    <h2>接下来学什么</h2>
    <p>路径 → 外部样式表 → 盒模型 → 布局。</p>
  </div>

  <div class="footer" style="min-height: 45vh; padding: 24px 4px; text-align: center; color: #666;">
    <p>© 张三 · 2026</p>
    <p><a href="#about">回到顶部</a></p>
  </div>

</body>
</html>
